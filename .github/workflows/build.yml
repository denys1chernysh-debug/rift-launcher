name: Build Rift Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        working-directory: rift
        run: npm install
      - name: Build Rift
        working-directory: rift
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Rift-Windows
          path: rift/src-tauri/target/release/bundle/nsis/*.exe
